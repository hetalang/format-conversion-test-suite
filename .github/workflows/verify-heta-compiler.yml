name: Verify heta-compiler conversion

on:
  workflow_dispatch:
    inputs:
      compiler_ref:
        description: 'heta-compiler branch, tag, or commit SHA'
        required: true
        default: master
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout FCTS
        uses: actions/checkout@v6

      - name: Checkout heta-compiler
        uses: actions/checkout@v6
        with:
          repository: hetalang/heta-compiler
          ref: ${{ inputs.compiler_ref }}
          path: heta-compiler

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install FCTS dependencies
        run: npm ci

      - name: Install heta-compiler from the selected ref
        run: |
          npm ci --prefix heta-compiler
          npm install --global ./heta-compiler
          heta --version

      - name: Download and index SBML cases
        run: |
          npm run fetch:sbml
          npm run index:sbml

      - name: Build SBML reports
        run: |
          node bin/fcts.js sbml-report --source=cases/index --input-field=sbmlL3V2Path --target=results/verification/l3 --concurrency=4 \
            --skip-component-tags=CSymbolDelay,EventWithDelay,AlgebraicRule,CSymbolRateOf,comp:Deletion,comp:ModelDefinition,comp:Port,comp:ReplacedBy,comp:ReplacedElement,comp:SBaseRef,comp:Submodel,fbc:FluxBound,fbc:FluxObjective,fbc:Objective \
            --skip-test-tags=AssignedVariableStoichiometry,AssignedConstantStoichiometry,SpeciesReferenceInMath,NoMathML,comp:SubmodelOutput,fbc:BoundEqual,fbc:BoundGreaterEqual,fbc:BoundLessEqual,fbc:MaximizeObjective,fbc:MinimizeObjective,fbc:NonStrict,BoolNumericSwap,VolumeConcentrationRates
          node bin/fcts.js sbml-report --source=cases/index --input-field=sbmlL3V1Path --target=results/verification/l3v1 --concurrency=4 \
            --skip-component-tags=CSymbolDelay,EventWithDelay,AlgebraicRule,CSymbolRateOf,comp:Deletion,comp:ModelDefinition,comp:Port,comp:ReplacedBy,comp:ReplacedElement,comp:SBaseRef,comp:Submodel,fbc:FluxBound,fbc:FluxObjective,fbc:Objective \
            --skip-test-tags=AssignedVariableStoichiometry,AssignedConstantStoichiometry,SpeciesReferenceInMath,NoMathML,comp:SubmodelOutput,fbc:BoundEqual,fbc:BoundGreaterEqual,fbc:BoundLessEqual,fbc:MaximizeObjective,fbc:MinimizeObjective,fbc:NonStrict,FastReaction,VolumeConcentrationRates
          node bin/fcts.js sbml-report --source=cases/index --input-field=sbmlL2V5Path --target=results/verification/l2 --concurrency=4 \
            --skip-component-tags=StoichiometryMath,CSymbolDelay,EventWithDelay,AlgebraicRule \
            --skip-test-tags=FastReaction,VolumeConcentrationRates

      - name: Fail when a case does not build
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const reports = [
            ['SBML L3V2', 'results/verification/l3/report.json'],
            ['SBML L3V1', 'results/verification/l3v1/report.json'],
            ['SBML L2V5', 'results/verification/l2/report.json'],
          ];
          const lines = ['| Report | Successful | Failed | Not evaluated |', '| --- | ---: | ---: | ---: |'];
          let failed = false;

          for (const [label, reportPath] of reports) {
            const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
            const counts = { success: 0, failed: 0, notEvaluated: 0 };
            for (const caseResult of report.cases) {
              if (caseResult.status === 'success') counts.success += 1;
              else if (caseResult.status === 'failed') counts.failed += 1;
              else if (caseResult.status === 'not-evaluated') counts.notEvaluated += 1;
            }
            lines.push(`| ${label} | ${counts.success} | ${counts.failed} | ${counts.notEvaluated} |`);
            failed ||= counts.failed > 0;
          }

          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${lines.join('\n')}\n`);
          if (failed) process.exitCode = 1;
          NODE

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fcts-build-reports-${{ github.run_id }}
          path: results/verification
          if-no-files-found: warn
